[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qompute-logical-magic"
version = "0.1.0"
description = "Local ideal and calibrated noisy simulations of encoded magic-state preparation"
requires-python = ">=3.11"
dependencies = ["qiskit==2.4.1", "qiskit-aer==0.17.2", "numpy>=1.26,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
ibm-noise = ["qiskit-ibm-runtime==0.47.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
